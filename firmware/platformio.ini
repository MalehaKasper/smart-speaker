; PlatformIO Project Configuration File — Smart Speaker 2.1 Firmware
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed = 921600

lib_deps =
    fastled/FastLED @ ^3.7.0
    z3t0/IRremote @ ^4.4.0
    h2zero/NimBLE-Arduino @ ^1.4.1
    pschatzmann/ESP32-A2DP @ ^1.8.5

build_flags =
    -D CORE_DEBUG_LEVEL=3
    ; Апаратний RMT-драйвер для WS2812B (FastLED), а не bit-bang — інакше
    ; переривання радіостека псують жорсткий 800kHz-таймінг стрічки.
    ; Точний флаг залежить від версії ESP-IDF, яку тягне platform=espressif32 —
    ; потребує підтвердження при першій реальній збірці (перевірити, чи FastLED
    ; 3.7.0 приймає саме FASTLED_RMT5, чи деградує без помилки на іншу версію).
    -D FASTLED_RMT5=1
